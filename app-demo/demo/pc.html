    window.fetch = async function(url, opts){
      const s = typeof url === 'string' ? url : url.toString();
      if (!s.includes('demo.mock.local')) return _orig(url, opts);
      let action = '';
      if (s.includes('?')) { action = new URLSearchParams(s.split('?')[1]).get('action') || ''; }
      if (!action && opts && opts.body) { try { action = JSON.parse(opts.body).action || ''; } catch(e){} }
      const r = MOCKS[action] || {success:true, data:[]};
      return new Response(JSON.stringify({...r, rowId: Date.now()}),
        {status:200, headers:{'Content-Type':'application/json'}});
    };
  })();
<\/script>`;

    const patched = html.slice(0, idx) + _MOCK2 + html.slice(idx);

    document.getElementById('frame').src = URL.createObjectURL(blob);
    document.getElementById('frame').onload = () =>
      document.getElementById('loader').classList.add('done');
  })
  .catch(e => {
    document.getElementById('loader').innerHTML =
      '<p style="color:#ffaaaa;padding:16px">로드 실패: ' + e.message + '</p>';
